version: 1
# AWS Amplify Hosting build spec for the Amplify Gen 2 app.
#
# ROOT CAUSE THIS FIXES: the frontend reads the deployed Cognito identity pool
# from amplify_outputs.json, which Vite inlines at BUILD TIME (import.meta.glob
# eager). If the backend is not deployed BEFORE the frontend build, the file is
# absent, the glob bakes in {}, and the app falls back to the no-auth OSM style.
#
# The `backend` phase runs `ampx pipeline-deploy`, which deploys the Gen 2
# backend for this branch and WRITES amplify_outputs.json to the app root —
# BEFORE the `frontend` phase runs `npm run build` (vite). This is the canonical
# Amplify Gen 2 full-stack ordering (backend → frontend).
backend:
  phases:
    build:
      commands:
        # Deploys this branch's backend (Cognito identity pool + unauth role +
        # geo-maps:GetTile grant) and emits amplify_outputs.json at the repo
        # root. $AWS_BRANCH / $AWS_APP_ID are provided by Amplify Hosting.
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    preBuild:
      commands:
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Fail the build if the backend phase did not produce the outputs file,
        # rather than silently shipping the OSM fallback again.
        - test -f amplify_outputs.json || (echo "ERROR: amplify_outputs.json missing — backend deploy did not run before frontend build" && exit 1)
        - npm run build
  artifacts:
    # Vite builds to dist/.
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - node_modules/**/*
